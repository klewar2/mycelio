# Alertes de sécurité et mises à jour hebdomadaires. Next et React sont groupés : ils se
# mettent à jour ensemble (eslint-config-next suit la version de Next).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["next", "eslint-config-next", "react", "react-dom"]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
