name: Migrations en production

# Le déploiement de la base était le seul maillon manuel de la chaîne — et c'est exactement
# celui qui a lâché. Le 3 août, le commit « familles » est parti sur Vercel avec son code et
# sans sa migration : la colonne `species.family` et la nouvelle signature de `forecast_in_view`
# n'existaient pas en production. `/api/species` a renvoyé 500, la carte n'a plus demandé aucun
# score, et elle est restée muette CINQ SEMAINES sans qu'aucune alerte ne se déclenche. Les
# données, elles, étaient bonnes tout du long.
#
# Rien ne rattrapait ce trou : la CI ne teste que la base locale, le cron de scoring n'écrit
# que des lignes, et l'application ne vérifie jamais que le schéma qu'elle attend est celui
# qu'elle trouve. D'où ce workflow — le schéma suit désormais le code, automatiquement, dans le
# même mouvement que le déploiement Vercel.
#
# Il tourne APRÈS la CI et seulement si elle passe : une migration appliquée en production
# depuis un commit dont les tests pgTAP échouent serait pire que pas de workflow du tout.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    name: Appliquer les migrations
    runs-on: ubuntu-latest
    # `workflow_run` se déclenche aussi sur un échec : sans ce garde, une CI rouge pousserait
    # quand même. `workflow_dispatch` n'a pas de conclusion, d'où la seconde branche.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Sur `workflow_run`, le checkout par défaut prend la tête de la branche, qui peut
          # avoir avancé depuis. On applique les migrations du commit qui a été testé.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `db push` est idempotent : il compare `supabase_migrations.schema_migrations` au dossier
      # et n'applique que ce qui manque. Un rejeu ne fait rien, et c'est ce qui permet de le
      # brancher sur chaque passage de la CI plutôt que sur un déclencheur manuel qu'on oublie.
      - name: supabase db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec supabase db push --db-url "$DATABASE_URL"

      # Filet de dernier recours. `db push` peut rendre 0 sans avoir rien appliqué si le dossier
      # et la base ont divergé autrement — une migration passée à la main sans être enregistrée,
      # par exemple, ce qui est précisément la situation qu'on vient de réparer. On vérifie donc
      # l'état réel de `schema_migrations`, pas le code de retour de la commande.
      #
      # En SQL et non via `supabase migration list` : la sortie de la CLI change de forme selon
      # la version — tableau ici, JSON là — et un contrôle de sécurité ne doit pas dépendre d'un
      # format d'affichage.
      - name: Vérifier qu'il ne reste rien à appliquer
        env:
          PGURL: ${{ secrets.DATABASE_URL }}
        run: |
          appliquees=$(psql "$PGURL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations")
          fichiers=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          echo "$appliquees migration(s) en base, $fichiers fichier(s) au dépôt."
          if [ "$appliquees" -lt "$fichiers" ]; then
            echo "::error::$((fichiers - appliquees)) migration(s) non appliquée(s) en production."
            psql "$PGURL" -c \
              "select version, name from supabase_migrations.schema_migrations order by version"
            exit 1
          fi
