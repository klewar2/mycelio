name: Scoring quotidien

# Deux créneaux, et non un seul.
#
# GitHub ne promet pas l'heure d'un `schedule` : il met le déclenchement en file et l'exécute
# quand sa charge le permet. Mesuré sur ce dépôt en août-septembre 2026, avec un cron demandé à
# 05h00 UTC : une demi-heure de retard les bons jours, mais 09h50, 11h27, 16h16 et jusqu'à
# 17h12 les mauvais. Un cueilleur qui ouvre la carte à 8h y voyait alors les scores de la
# veille, sans que rien ne l'indique.
#
# On ne peut pas forcer l'ordonnanceur, seulement lui laisser deux chances. Le second créneau
# rattrape le premier et s'arrête de lui-même si celui-ci a fini par passer (--rattrapage).
# Les minutes ne sont pas rondes non plus : l'heure pile concentre les crons de la plateforme
# entière, et c'est là que la file est la plus longue.
#
# 05h17 UTC : la prévision Open-Meteo du jour est publiée depuis peu, et personne ne consulte
# encore. Effet de bord bienvenu, cette écriture quotidienne empêche la mise en veille
# automatique du projet Supabase gratuit, qui s'endort après une semaine d'inactivité.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 8 * * *"
  workflow_dispatch:

jobs:
  score:
    name: Recalculer les scores
    runs-on: ubuntu-latest
    # Le calcul lui-même prend une douzaine de secondes ; la marge couvre la lenteur
    # éventuelle d'Open-Meteo.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances
        working-directory: pipeline
        run: uv sync --frozen

      - name: Calculer et charger les scores
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Vide pour un déclenchement manuel : on veut alors recalculer sans condition.
          RATTRAPAGE: ${{ github.event.schedule == '43 8 * * *' && '--rattrapage' || '' }}
        run: uv run python -m mycelio.score $RATTRAPAGE

      # Le pipeline trace lui-même ses échecs dans forecast_runs, mais un run qui n'atteint
      # jamais la base ne laisse aucune trace : d'où cette alerte de dernier recours.
      - name: Signaler l'échec
        if: failure()
        run: echo "::error::Le scoring quotidien a échoué. Voir public.forecast_runs."
